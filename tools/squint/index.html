<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squint</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f7f6; --line:#e3e2de; --ink:#1d1d1b;
    --muted:#8a8a84; --sel:#fffc76; --del:#a8322d; --add:#2a7d4f; --brk:#7a73c0;
    --sans:-apple-system,'Avenir','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'Menlo',Consolas,'SF Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
       display:flex;flex-direction:column;font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header .t{font-weight:600;letter-spacing:.04em}
  header .t small{color:var(--muted);font-weight:400;letter-spacing:0}
  select,button{font-family:var(--sans);font-size:13px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 9px}
  button{cursor:pointer}
  button:hover{border-color:var(--ink)}
  .grow{flex:1}
  .count{color:var(--muted);min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
  .nav{padding:5px 10px}
  main{flex:1;display:grid;grid-template-columns:108px 1fr 480px;min-height:0}
  .rail{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);padding:6px;min-width:0}
  .thumb{display:block;width:100%;border:1px solid var(--line);border-radius:2px;
         margin-bottom:6px;background:#fff;cursor:pointer;opacity:.8;overflow:hidden}
  .thumb:hover{opacity:1}
  .thumb.on{outline:2px solid var(--sel);outline-offset:1px;opacity:1;border-color:var(--ink)}
  /* whole page in one tile; ~6 tiles fit a normal desktop viewport */
  .thumb img{display:block;width:100%;height:calc((100vh - 46px)/6 - 18px);
             object-fit:contain;background:#fff}
  .thumb .n{display:block;font-size:9px;color:var(--muted);text-align:center;padding:1px 0 2px}
  .imgwrap{overflow:auto;background:#efeeea;display:flex;align-items:flex-start;justify-content:center;min-width:0;min-height:0}
  .imgwrap img{max-width:100%;height:auto;display:block;background:#fff;margin:14px;
               box-shadow:0 1px 4px rgba(0,0,0,.12);user-select:none;-webkit-user-drag:none}
  .imgwrap.zoom{display:block}            /* drop flex-centering so overflow scrolls from the true start */
  .imgwrap.zoom img{max-width:none;margin:50vh 50vw}  /* overpan room: edges/corners can reach center */
  .imgwrap.zoom{cursor:grab}
  .imgwrap.zoom.drag{cursor:grabbing}
  .txtpane{display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
  .txtbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tag{padding:3px 8px;font-size:12px;font-family:var(--mono);font-weight:600}
  .tag.del{color:var(--del)} .tag.add{color:var(--add)} .tag.brk{color:var(--brk)}
  /* highlighted-textarea: colored backdrop under a transparent editable textarea */
  .editor{flex:1;position:relative;overflow:hidden}
  .layer{position:absolute;inset:0;margin:0;padding:14px;border:0;
    font-family:var(--mono);font-size:13px;line-height:1.55;letter-spacing:0;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;tab-size:2}
  #hl{color:var(--ink);background:transparent;pointer-events:none;overflow:hidden;z-index:1}
  #hl .t-del{color:var(--del)} #hl .t-add{color:var(--add)} #hl .t-brk{color:var(--brk)}
  #box{color:transparent;background:transparent;caret-color:var(--ink);
    resize:none;outline:0;overflow:auto;z-index:2}
  #box::selection{background:#cfe0ff}
  .ptr{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;
    user-select:all;line-height:1.5}
  .ptr b{color:var(--ink);font-weight:600}
  .ok{color:var(--add)} .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <span class="t">Squint <small>· Peirce transcriptions</small></span>
  <select id="item"></select>
  <button class="nav" id="prev" title="Previous page (k)">‹</button>
  <span class="count" id="count"></span>
  <button class="nav" id="next" title="Next page (j)">›</button>
  <span class="grow"></span>
  <span class="hint" style="margin-right:4px">double-click image to zoom</span>
  <button id="refresh" title="Re-read the file after your agent edits it">refresh</button>
</header>
<main>
  <div class="rail" id="rail"></div>
  <div class="imgwrap" id="imgwrap"><img id="img" alt=""></div>
  <div class="txtpane">
    <div class="txtbar">
      <button class="tag del" data-b="{del}" data-a="{/del}" title="Wrap selection / insert deletion (⌘D)">{del}</button>
      <button class="tag add" data-b="{add}" data-a="{/add}" title="Wrap selection / insert insertion (⌘I)">{add}</button>
      <button class="tag brk" data-b="[unclear: " data-a="?]" title="Mark uncertain reading (⌘U)">[unclear]</button>
      <button class="tag brk" data-b="[illegible]" data-a="" title="Insert illegible">[illeg]</button>
      <button class="tag brk" data-b="[diagram: " data-a="]" title="Mark a diagram/figure">[diagram]</button>
      <span class="grow"></span>
      <button id="copy" title="Copy markup + pointer for your coding agent (⌘C)">copy</button>
      <span class="hint" id="status"></span>
    </div>
    <div class="editor">
      <div id="hl" class="layer"></div>
      <textarea id="box" class="layer" spellcheck="false"></textarea>
    </div>
    <div class="ptr" id="ptr"></div>
  </div>
</main>
<script>
let ITEMS=[], cur={robin:null, pages:[], i:0}, META={path:"",url:"",cite:""};
const $ = s => document.querySelector(s);
const j = async u => (await fetch(u)).json();
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// colored backdrop: tags get the same color as their button
function highlight(t){
  return esc(t)
    .replace(/(\{del\}[\s\S]*?\{\/del\})/g,'<span class="t-del">$1</span>')
    .replace(/(\{add\}[\s\S]*?\{\/add\})/g,'<span class="t-add">$1</span>')
    .replace(/(\[unclear:[\s\S]*?\]|\[illegible\]|\[diagram:[\s\S]*?\])/g,'<span class="t-brk">$1</span>')
    + "\n";
}
function syncHL(){ $("#hl").innerHTML = highlight($("#box").value); }
function syncScroll(){ const b=$("#box"); $("#hl").scrollTop=b.scrollTop; $("#hl").scrollLeft=b.scrollLeft; }

// markdown-style: wrap the highlighted text, or insert the tag pair at the cursor
function applyTag(before, after){
  const ta=$("#box"), s=ta.selectionStart, e=ta.selectionEnd, v=ta.value, sel=v.slice(s,e);
  const repl=before+sel+after;
  ta.value=v.slice(0,s)+repl+v.slice(e);
  if(sel) ta.setSelectionRange(s, s+repl.length);
  else   { const c=s+before.length; ta.setSelectionRange(c,c); }
  ta.focus(); syncHL();
}

async function loadPage(i){
  cur.i=(i+cur.pages.length)%cur.pages.length;
  const img=cur.pages[cur.i];
  $("#img").src=`/img/${cur.robin}/${img}?size=full`;
  $("#count").textContent=`${cur.i+1} / ${cur.pages.length}`;
  document.querySelectorAll(".thumb").forEach((t,k)=>t.classList.toggle("on",k===cur.i));
  const on=document.querySelector(".thumb.on"); if(on) on.scrollIntoView({block:"nearest"});
  const d=await j(`/api/txt?robin=${cur.robin}&img=${img}`);
  META={path:d.path||"",url:d.url||"",cite:d.cite||""};
  $("#box").value=d.text||""; syncHL(); $("#box").scrollTop=0; syncScroll();
  $("#ptr").innerHTML=`<b>file</b> ${esc(META.path)}\n<b>source</b> ${esc(META.url)}\n<b>cite</b> ${esc(META.cite)}`;
  $("#status").textContent="";
}
function selectItem(robin){
  const it=ITEMS.find(x=>x.robin===robin); if(!it) return;
  cur={robin,pages:it.pages,i:0};
  const rail=$("#rail"); rail.innerHTML="";
  it.pages.forEach((img,k)=>{
    const b=document.createElement("div"); b.className="thumb";
    const im=document.createElement("img"); im.loading="lazy"; im.src=`/img/${robin}/${img}?size=thumb`;
    const n=document.createElement("span"); n.className="n"; n.textContent=img.replace(/^IMG_?/,"");
    b.append(im,n); b.onclick=()=>loadPage(k); rail.appendChild(b);
  });
  loadPage(0);
}
function copyOut(){
  const block=$("#box").value.replace(/\s+$/,"")
    +"\n\n---\nfile: "+META.path+"\nsource: "+META.url+"\ncite: "+META.cite+"\n";
  navigator.clipboard.writeText(block).then(()=>{
    $("#status").innerHTML='<span class="ok">copied ✓</span>';
    setTimeout(()=>$("#status").textContent="",1500);
  });
}

document.querySelectorAll(".tag").forEach(b=>b.onclick=()=>applyTag(b.dataset.b,b.dataset.a));
$("#box").addEventListener("input",syncHL);
$("#box").addEventListener("scroll",syncScroll);
$("#item").onchange=e=>selectItem(e.target.value);
$("#prev").onclick=()=>loadPage(cur.i-1);
$("#next").onclick=()=>loadPage(cur.i+1);
$("#refresh").onclick=()=>loadPage(cur.i);
$("#copy").onclick=copyOut;
// double-click image to toggle zoom, centering on the clicked point
$("#imgwrap").addEventListener("dblclick",e=>{
  const iw=$("#imgwrap"), img=$("#img");
  const zin=!iw.classList.contains("zoom");
  const r=img.getBoundingClientRect();
  const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
  iw.classList.toggle("zoom");
  if(zin) requestAnimationFrame(()=>{
    const ir=img.getBoundingClientRect(), wr=iw.getBoundingClientRect();
    iw.scrollLeft += (ir.left+fx*ir.width) - (wr.left+iw.clientWidth/2);
    iw.scrollTop  += (ir.top +fy*ir.height) - (wr.top +iw.clientHeight/2);
  });
});
// drag-to-pan the image when zoomed
(()=>{ const iw=$("#imgwrap"); let p=null;
  iw.addEventListener("mousedown",e=>{ if(!iw.classList.contains("zoom"))return;
    p={x:e.clientX,y:e.clientY,l:iw.scrollLeft,t:iw.scrollTop}; iw.classList.add("drag"); e.preventDefault(); });
  window.addEventListener("mousemove",e=>{ if(!p)return;
    iw.scrollLeft=p.l-(e.clientX-p.x); iw.scrollTop=p.t-(e.clientY-p.y); });
  window.addEventListener("mouseup",()=>{ if(p){p=null; iw.classList.remove("drag");} });
})();
document.addEventListener("keydown",e=>{
  const meta=e.metaKey||e.ctrlKey;
  if(meta&&e.key==="d"){e.preventDefault();applyTag("{del}","{/del}");return;}
  if(meta&&e.key==="i"){e.preventDefault();applyTag("{add}","{/add}");return;}
  if(meta&&e.key==="u"){e.preventDefault();applyTag("[unclear: ","?]");return;}
  if(meta&&e.key==="c"&&$("#box").selectionStart===$("#box").selectionEnd){e.preventDefault();copyOut();return;}
  if(e.target.id==="box") return;
  if(e.key==="ArrowDown"||e.key==="j"){loadPage(cur.i+1);e.preventDefault();}
  if(e.key==="ArrowUp"||e.key==="k"){loadPage(cur.i-1);e.preventDefault();}
});
(async()=>{
  ITEMS=await j("/api/items");
  const sel=$("#item");
  ITEMS.forEach(it=>{
    const o=document.createElement("option");
    o.value=it.robin; o.textContent=`R${it.robin} · ${it.title} (${it.pages.length})`;
    sel.appendChild(o);
  });
  if(ITEMS.length) selectItem(ITEMS[0].robin);
})();
</script>
</body>
</html>
